<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/login.css">
    <title>Login</title>
  </head>
  <body>
    <header class="topo">
      <h1>Bem vindo de volta!</h1>
    </header>
    <main>
     <form action="index.html">
      <h2>Informações de Login</h2>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          aria-required="true"
          aria-label="Campo para endereço de email"
          placeholder="Digite seu e-mail"
        />

        <label for="senha">Senha:</label>
        <input class="senha"
          type="password"
          id="senha"
          name="senha"
          required
          minlength="8"
          aria-required="true"
          aria-label="Campo para senha"
          placeholder="Coloque sua senha"
        />
        <p>Esqueceu sua senha? <a href="">Clique aqui</a></p>

        <button type="submit" required >Entrar</button>
      </form>
    </main>
    <footer>
      Não tem uma conta? <a href="cadastro.html">Clique aqui</a>
    </footer>
  </body>
</html>
